name: Pipelines

on:
  schedule:
    - cron: "17 3 * * 1"     # weekly full refresh, Monday 03:17 UTC
    - cron: "*/30 * * * *"   # sweep for runs queued from Admin
  workflow_dispatch:
    inputs:
      mode:
        description: "all | queued | compute | score | eval | <source slug>"
        required: true
        default: queued

permissions:
  contents: read

concurrency:
  group: pipelines
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # A full run is about an hour: GDELT (120 queries, 5 s spacing), Bluesky (188 queries), OFF (161 queries, 6.5 s spacing), then scoring.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Decide mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then mode="$INPUT_MODE";
          elif [ "$SCHEDULE" = "17 3 * * 1" ]; then mode="all";
          else mode="queued"; fi
          # Only known modes and connector slugs reach the shell command below.
          case "$mode" in
            all|queued|compute|score|eval|eurostat|istat|osm|openfoodfacts|gdelt|wikimedia|bluesky) ;;
            *) echo "::error::unknown mode '$mode'"; exit 1 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      # Two steps so the Anthropic and Bluesky secrets only reach the modes that use them.
      # The service key is given to these steps only, never to dependency installation.
      - name: Run (statistics and signals)
        if: steps.mode.outputs.mode != 'all' && steps.mode.outputs.mode != 'queued' && steps.mode.outputs.mode != 'score' && steps.mode.outputs.mode != 'eval' && steps.mode.outputs.mode != 'bluesky'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          case "$MODE" in
            compute) pnpm pipeline compute ;;
            *)       pnpm pipeline "$MODE" && pnpm pipeline compute ;;
          esac
      - name: Run (mentions and scoring)
        if: steps.mode.outputs.mode == 'all' || steps.mode.outputs.mode == 'queued' || steps.mode.outputs.mode == 'score' || steps.mode.outputs.mode == 'eval' || steps.mode.outputs.mode == 'bluesky'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          case "$MODE" in
            queued)  pnpm pipeline --queued ;;
            score)   pnpm pipeline score && pnpm pipeline compute ;;
            eval)    pnpm eval:mention-score ;;
            all)     pnpm pipeline all ;;
            bluesky) pnpm pipeline bluesky && pnpm pipeline score && pnpm pipeline compute ;;
          esac
